    dashscope:
      chat-model:
        model-name: qwen-plus
        api-key: ${DASHSCOPE_API_KEY:}
        timeout: PT5M  # 设置5分钟超时
        tool-configuration: # ← 添加工具配置
          disable-parallel-tool-use: true # 禁止并行工具调用，强制串联执行
      # 要想实现RAG功能，必须要配置这个嵌入式模型
      embedding-model:
        model-name: text-embedding-v3
        api-key: ${DASHSCOPE_API_KEY:}
        timeout: PT5M  # 设置5分钟超时

      # 流式输出模型
      streaming-chat-model:
