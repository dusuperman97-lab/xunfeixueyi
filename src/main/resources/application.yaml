rag:
  global-knowledge:
    enabled: false
    namespace: global-knowledge
  # 智能分片器配置
  splitter:
    chunk-size: 500      # 每个分片的最大字符数
    overlap: 100         # 相邻分片之间的重叠字符数
  # Rerank配置（SiliconFlow）
  rerank:
    api-key: ${RERANK_API_KEY:}   # 设置环境变量 RERANK_API_KEY 启用
    model: BAAI/bge-reranker-v2-m3
    top-n: 3


# AI课程生成默认配置
ai-course:
  defaults:
    # 难度级别选项
    levels:
      - code: beginner
        name: 入门级
        description: 适合零基础学习者
      - code: intermediate
        name: 进阶级
        description: 适合有一定基础的学习者
      - code: advanced
        name: 高级
        description: 适合有丰富经验的学习者

    # 学习周期选项
    durations:
      - "7天"
      - "15天"
      - "30天"
      - "60天"
      - "90天"

    # 教学风格选项
    styles:
      - code: project-based
        name: 项目驱动
        description: 通过实际项目学习，边做边学
      - code: theory-based
        name: 理论导向
        description: 系统讲解理论知识，夯实基础
      - code: practice-oriented
        name: 实践导向
        description: 大量练习和案例，强化动手能力
      - code: interview-focused
        name: 面试突击
        description: 针对面试重点，快速提升

    # 热门主题推荐
    popular-topics:
      - "Java后端开发"
      - "Python数据分析"
      - "前端Vue3开发"
      - "Spring Boot微服务"
      - "人工智能基础"
      - "MySQL数据库优化"
      - "Redis缓存实战"
      - "Docker容器化部署"

pinecone_key: ${PINECONE_API_KEY:}

# 会员积分系统配置
member-points:
  initial-points: 100  # 新用户初始赠送积分

# AI工具积分消耗配置
points-consumption:
  course-generation: 10     # 课程生成消耗积分
  ppt-generation: 10        # PPT生成消耗积分
  mindmap-generation: 5     # 思维导图生成消耗积分
  ai-chat: 2                # AI对话消耗积分
  exam-generation: 5        # 考试题目生成消耗积分
  content-verification: 3   # 内容真实性校验消耗积分

# 考试时间管理配置
exam:
  default-duration: 3600    # 默认考试时长（秒），60分钟
  auto-save-interval: 30    # 前端自动保存间隔（秒），建议值
  timeout-check-interval: 30000  # 服务端超时扫描间隔（毫秒）

# 支付宝沙箱支付配置（密钥已移至 application-secret.yml）
alipay:
  app-id: 9021000165604715
  private-key: ${ALIPAY_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  server-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: ${ALIPAY_NOTIFY_URL:}
  return-url: http://localhost:9000/alipay/return

# Neo4j 健康检查
management:
  health:
    neo4j:
      enabled: true
