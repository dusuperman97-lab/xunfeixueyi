server:
  ip: 43.136.88.189
  port: 9000
# CORS跨域配置
cors:
  allowed-origins: http://localhost:5173,http://localhost:5175,http://43.136.88.189
# ============================================================
# 引入敏感配置文件 application-secret.yml
# 该文件包含数据库密码、API Key 等敏感信息，已加入 .gitignore
# 本地开发时需自行创建，参考 application-secret.yml.example
# ============================================================
spring:
  config:
    import:
      - optional:classpath:application-secret.yml
      - optional:file:src/main/resources/application-secret.yml

  main:
    allow-circular-references: true #允许循环引用

  alioss:
    endpoint: oss-cn-shenzhen.aliyuncs.com
    access-key-id: ${ALIOSS_ACCESS_KEY_ID:}
    bucket-name: aliyun-database
    access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET:}

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/chat_memory_db}

  # Neo4j 图数据库配置（Spring Boot 3.x 自动配置）
  neo4j:
    uri: neo4j://127.0.0.1
    authentication:
      username: neo4j
      password: ${NEO4J_PASSWORD:2024404501}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://47.97.153.1:3306/agentpro?useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: agentpro
    password: ${MYSQL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 0MB # 文件上传大小限制，设置最大值，不能超过该值，否则报错
      max-request-size: 1000MB # 文件最大请求限制，用于批量上传

  jackson: # Jackson库配置
    date-format: "yyyy-MM-dd HH:mm:ss" # 设置日期格式为"年-月-日 时:分:秒"
    serialization:
      write-dates-as-timestamps: false # 关闭日期序列化为时间戳的功能
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 300s  # 将等待时间从 30s 改为 5s

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/course_workflow_schema.sql
      continue-on-error: true

mybatis:
  mapper-locations: classpath:mapper/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true #启用驼峰命名转换
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL到控制台（已关闭）
  # logging:
  #   level: debug # 设置MyBatis的日志级别为DEBUG以打印SQL语句（已关闭）
resetPassword: ${RESET_PASSWORD:123456}
spring.main.all-circular-references: true


langchain4j:
